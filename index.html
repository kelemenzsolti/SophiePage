<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="faviconNew.svg" />
    <meta name="theme-color" content="#fbf8f3" />

    <title>Czárth Zsófia – Iskolapszichológus &amp; Sportpszichológiai Tanácsadó</title>
    <meta
      name="description"
      content="Iskolapszichológus és sportpszichológiai tanácsadó. Segítek a gyermekek, fiatalok, szülők és sportolók mentális felkészülésében és elakadásaikban."
    />
    <meta name="author" content="Czárth Zsófia" />

    <!-- Canonical origin. The site answers on both the custom domain and
         kelemenzsolti.github.io/SophiePage/; without this, Google treats them as
         duplicates and splits ranking signals between them. %SITE_URL% is
         substituted at build time from src/site.config.ts — the one place the
         domain is written down. -->
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Social previews. Crawlers require absolute URLs, so these cannot use the
         relative paths the rest of the document does. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:site_name" content="Czárth Zsófia" />
    <meta property="og:locale" content="hu_HU" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta
      property="og:title"
      content="Czárth Zsófia – Iskolapszichológus &amp; Sportpszichológiai Tanácsadó"
    />
    <meta
      property="og:description"
      content="Iskolapszichológus és sportpszichológiai tanácsadó. Segítek a gyermekek, fiatalok, szülők és sportolók mentális felkészülésében és elakadásaikban."
    />
    <meta property="og:image" content="%SITE_URL%/assets/img/portrait.jpg" />
    <meta property="og:image:width" content="768" />
    <meta property="og:image:height" content="1152" />
    <meta
      property="og:image:alt"
      content="Czárth Zsófia iskolapszichológus és sportpszichológiai tanácsadó portréja"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Czárth Zsófia – Iskolapszichológus &amp; Sportpszichológiai Tanácsadó"
    />
    <meta
      name="twitter:description"
      content="Iskolapszichológus és sportpszichológiai tanácsadó. Segítek a gyermekek, fiatalok, szülők és sportolók mentális felkészülésében és elakadásaikban."
    />
    <meta name="twitter:image" content="%SITE_URL%/assets/img/portrait.jpg" />

    <!-- Fraunces and Inter are self-hosted (`npm run fonts`) and bundled through
         `src/fonts.css`. Linking fonts.googleapis.com here cost a render-blocking
         stylesheet on a third origin before any glyph could paint. -->

    <!-- The hero photograph is the LCP element, but React renders it, so the
         preload scanner cannot see it in this markup. The `site-metadata` plugin
         in vite.config.ts expands this from the same image manifest <Picture>
         uses, so the preload and the <picture> always resolve to one request
         rather than downloading the hero twice. -->
    <!--%LCP_PRELOAD%-->

    <!-- Structured data. One @graph of cross-referenced entities rather than a
         single flat node, so Google can tell the practitioner (Person) apart
         from the practice (Psychologist) and still know they are the same
         operation. The @id values are the joins; they are URL fragments, not
         pages, and never need to resolve.

         Deliberately absent: telephone and email. Both are obfuscated in
         src/content/site.ts to keep them away from scrapers, and both are still
         development placeholders — publishing a wrong number in structured data
         is worse than publishing none. Add them here once they are real. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "url": "%SITE_URL%/",
            "name": "Czárth Zsófia",
            "inLanguage": "hu-HU",
            "publisher": { "@id": "%SITE_URL%/#person" }
          },
          {
            "@type": "WebPage",
            "@id": "%SITE_URL%/#webpage",
            "url": "%SITE_URL%/",
            "name": "Czárth Zsófia – Iskolapszichológus & Sportpszichológiai Tanácsadó",
            "description": "Iskolapszichológus és sportpszichológiai tanácsadó. Segítek a gyermekek, fiatalok, szülők és sportolók mentális felkészülésében és elakadásaikban.",
            "inLanguage": "hu-HU",
            "isPartOf": { "@id": "%SITE_URL%/#website" },
            "about": { "@id": "%SITE_URL%/#person" },
            "primaryImageOfPage": { "@id": "%SITE_URL%/#portrait" }
          },
          {
            "@type": "ImageObject",
            "@id": "%SITE_URL%/#portrait",
            "url": "%SITE_URL%/assets/img/portrait.jpg",
            "contentUrl": "%SITE_URL%/assets/img/portrait.jpg",
            "width": 768,
            "height": 1152,
            "caption": "Czárth Zsófia iskolapszichológus és sportpszichológiai tanácsadó"
          },
          {
            "@type": "Person",
            "@id": "%SITE_URL%/#person",
            "name": "Czárth Zsófia",
            "givenName": "Zsófia",
            "familyName": "Czárth",
            "url": "%SITE_URL%/",
            "image": { "@id": "%SITE_URL%/#portrait" },
            "jobTitle": "Iskolapszichológus & Sportpszichológiai Tanácsadó",
            "description": "Iskolapszichológus és sportpszichológiai tanácsadó. Gyermekek, fiatalok, szülők és sportolók mentális támogatása.",
            "knowsLanguage": ["hu", "en"],
            "knowsAbout": [
              "Iskolapszichológia",
              "Sportpszichológia",
              "Teljesítményszorongás",
              "Versenyszorongás",
              "Tanulási nehézségek",
              "Serdülőkori elakadások",
              "Szülői konzultáció",
              "Pályaválasztási tanácsadás"
            ],
            "sameAs": [
              "https://www.instagram.com/psychologysophie/",
              "https://www.facebook.com/csengezsofia.czarth.3",
              "https://www.linkedin.com/in/czarthcsengezsofia/"
            ],
            "worksFor": { "@id": "%SITE_URL%/#practice" }
          },
          {
            "@type": ["Psychologist", "ProfessionalService"],
            "@id": "%SITE_URL%/#practice",
            "name": "Czárth Zsófia – Iskolapszichológus & Sportpszichológiai Tanácsadó",
            "url": "%SITE_URL%/",
            "image": { "@id": "%SITE_URL%/#portrait" },
            "description": "Online iskolapszichológiai és sportpszichológiai tanácsadás gyermekeknek, fiataloknak, szülőknek és sportolóknak.",
            "founder": { "@id": "%SITE_URL%/#person" },
            "priceRange": "13000–15000 HUF",
            "currenciesAccepted": "HUF",
            "availableLanguage": ["hu", "en"],
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Budapest",
              "addressCountry": "HU"
            },
            "areaServed": [
              { "@type": "City", "name": "Budapest" },
              { "@type": "Country", "name": "Magyarország" }
            ],
            "hasOfferCatalog": {
              "@type": "OfferCatalog",
              "name": "Tanácsadási szolgáltatások",
              "itemListElement": [
                {
                  "@type": "Offer",
                  "name": "Egyéni tanácsadás (diák / fiatal)",
                  "description": "Iskolai elakadások, szorongás, motiváció és kortárs kapcsolatok támogatása 1–12. osztályos korosztálynak.",
                  "price": "15000",
                  "priceCurrency": "HUF",
                  "availability": "https://schema.org/InStock",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Egyéni pszichológiai tanácsadás",
                    "serviceType": "Iskolapszichológiai tanácsadás",
                    "provider": { "@id": "%SITE_URL%/#practice" }
                  }
                },
                {
                  "@type": "Offer",
                  "name": "Sportpszichológiai tanácsadás",
                  "description": "Versenynyomás, teljesítményszorongás, fókusz és önbizalom fejlesztése fiatal és felnőtt sportolóknak.",
                  "price": "15000",
                  "priceCurrency": "HUF",
                  "availability": "https://schema.org/InStock",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Sportpszichológiai tanácsadás",
                    "serviceType": "Sportpszichológia",
                    "provider": { "@id": "%SITE_URL%/#practice" }
                  }
                },
                {
                  "@type": "Offer",
                  "name": "Szülő konzultáció & tanácsadás",
                  "description": "Nevelési kérdések, családi dinamikák és a gyermek iskolai/sportbeli támogatásának egyeztetése.",
                  "price": "13000",
                  "priceCurrency": "HUF",
                  "availability": "https://schema.org/InStock",
                  "itemOffered": {
                    "@type": "Service",
                    "name": "Szülői konzultáció",
                    "serviceType": "Szülői konzultáció",
                    "provider": { "@id": "%SITE_URL%/#practice" }
                  }
                }
              ]
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
