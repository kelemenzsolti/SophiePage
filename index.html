<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="faviconNew.svg" />
    <meta name="theme-color" content="#fbf8f3" />

    <title>Czárth Zsófia – Iskolapszichológus &amp; Sportpszichológiai Tanácsadó</title>
    <meta
      name="description"
      content="Iskolapszichológus és sportpszichológiai tanácsadó. Segítek a gyermekek, fiatalok, szülők és sportolók mentális felkészülésében és elakadásaikban."
    />
    <meta name="author" content="Czárth Zsófia" />

    <!-- Social previews. Swap the og:url/og:image origin for the production
         domain once it is registered — crawlers require absolute URLs. -->
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Czárth Zsófia" />
    <meta property="og:locale" content="hu_HU" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta
      property="og:title"
      content="Czárth Zsófia – Iskolapszichológus &amp; Sportpszichológiai Tanácsadó"
    />
    <meta
      property="og:description"
      content="Iskolapszichológus és sportpszichológiai tanácsadó. Segítek a gyermekek, fiatalok, szülők és sportolók mentális felkészülésében és elakadásaikban."
    />
    <meta property="og:image" content="assets/img/portrait.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fraunces and Inter are self-hosted (`npm run fonts`) and bundled through
         `src/fonts.css`. Linking fonts.googleapis.com here cost a render-blocking
         stylesheet on a third origin before any glyph could paint. -->

    <!-- The hero photograph is the LCP element, but React renders it, so the
         preload scanner cannot see it in this markup. This preload starts the
         download during HTML parse instead of after the bundle executes. It
         mirrors the AVIF <source> in <Picture> exactly — same srcset, same
         sizes — so the two resolve to one request, not two. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      fetchpriority="high"
      imagesrcset="
        assets/img/hero-640.avif   640w,
        assets/img/hero-960.avif   960w,
        assets/img/hero-1280.avif 1280w,
        assets/img/hero-1600.avif 1600w,
        assets/img/hero-1920.avif 1920w,
        assets/img/hero-2560.avif 2560w
      "
      imagesizes="100vw"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Psychologist",
        "name": "Czárth Zsófia",
        "description": "Iskolapszichológus és sportpszichológiai tanácsadó. Gyermekek, fiatalok, szülők és sportolók mentális támogatása.",
        "image": "assets/img/portrait.jpg",
        "areaServed": "Budapest, Magyarország",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Budapest",
          "addressCountry": "HU"
        },
        "knowsLanguage": ["hu", "en"],
        "sameAs": [
          "https://www.instagram.com/psychologysophie/",
          "https://www.facebook.com/csengezsofia.czarth.3",
          "https://www.linkedin.com/in/czarthcsengezsofia/"
        ],
        "makesOffer": [
          {
            "@type": "Offer",
            "name": "Egyéni tanácsadás (diák / fiatal)",
            "price": "15000",
            "priceCurrency": "HUF"
          },
          {
            "@type": "Offer",
            "name": "Sportpszichológiai tanácsadás",
            "price": "15000",
            "priceCurrency": "HUF"
          },
          {
            "@type": "Offer",
            "name": "Szülő konzultáció & tanácsadás",
            "price": "13000",
            "priceCurrency": "HUF"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
